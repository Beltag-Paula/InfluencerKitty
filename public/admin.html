<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitty">
<link rel="apple-touch-icon" href="/assets/images/logo/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/images/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/admin.css">
<title>Admin - Kitty</title>
</head>
<body class="admin">
<div class="admin-shell">
  <aside class="admin-side">
    <a class="logo light" href="/admin.html"><img src="/assets/images/logo/logo-cat.svg" alt="" width="44" height="41"><span>Kitty</span></a>
    <p class="side-label">Admin</p>
    <nav id="admin-nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="products">Products</button>
      <button data-view="orders">Orders</button>
      <button data-view="customers">Customers</button>
    </nav>
    <div class="side-foot"><a href="/">View shop</a><button type="button" data-logout>Log out</button></div>
  </aside>
  <main class="admin-main" id="view"><p class="muted">Loading...</p></main>
</div>

<dialog id="product-dialog" aria-labelledby="dlg-title">
  <form id="product-form" novalidate>
    <h2 id="dlg-title">Add product</h2>
    <div class="form-error" id="pf-error" role="alert"></div>
    <div class="field"><label for="pf-name">Name</label><input id="pf-name" type="text" maxlength="120" required></div>
    <div class="field-row">
      <div class="field"><label for="pf-category">Category</label><input id="pf-category" type="text" list="category-list" maxlength="40" required><datalist id="category-list"></datalist></div>
      <div class="field"><label for="pf-stock">Stock</label><input id="pf-stock" type="number" min="0" step="1" required></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="pf-price">Price</label><input id="pf-price" type="number" min="0.01" step="0.01" required></div>
      <div class="field"><label for="pf-discount">Discount %</label><input id="pf-discount" type="number" min="0" max="90" step="1" value="0"><p class="hint" id="pf-preview"></p></div>
    </div>
    <div class="field"><label for="pf-desc">Description</label><textarea id="pf-desc" maxlength="2000"></textarea></div>
    <div class="field"><label>Images <span class="muted">(the first one is the main image)</span></label>
      <div class="img-list" id="pf-images"></div>
      <div class="img-add"><input type="file" id="pf-file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden><button type="button" class="btn btn-sm btn-ghost" id="pf-upload">Upload images</button>
        <input type="text" id="pf-url" placeholder="or paste an https:// image link"><button type="button" class="btn btn-sm btn-ghost" id="pf-url-add">Add link</button></div>
      <p class="hint">PNG, JPG, GIF or WebP, up to 4 MB each.</p></div>
    <label class="check"><input type="checkbox" id="pf-featured"> Featured product</label>
    <div class="dlg-actions"><button type="button" class="btn btn-ghost" id="pf-cancel">Cancel</button><button type="submit" class="btn" id="pf-save">Save product</button></div>
  </form>
</dialog>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
